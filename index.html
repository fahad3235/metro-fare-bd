<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro Fare BD &#x2014; Dhaka Metro Rail Fare Calculator</title>
<meta name="description" content="Offline Dhaka Metro Rail (MRT Line 6) fare calculator: all 16 stations, single-journey and pass fares, full fare chart, pass savings.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">&#x1f687;</span><div><h1>Metro Fare BD</h1><p data-i18n="tagline"></p></div></div>
  <button id="langBtn" type="button">&#x9ac;&#x9be;&#x982;&#x9b2;&#x9be;</button>
</header>
<nav class="tabs" role="tablist">
  <button class="tabbtn active" type="button" data-tab="calc" data-i18n="tabCalc"></button>
  <button class="tabbtn" type="button" data-tab="chart" data-i18n="tabChart"></button>
  <button class="tabbtn" type="button" data-tab="pass" data-i18n="tabPass"></button>
  <button class="tabbtn" type="button" data-tab="line" data-i18n="tabLine"></button>
</nav>
<main>
  <section class="tab" id="tab-calc">
    <div class="card">
      <div class="field">
        <label for="fromSel" data-i18n="from"></label>
        <select id="fromSel"></select>
      </div>
      <button id="swapBtn" type="button" data-i18n="swap"></button>
      <div class="field">
        <label for="toSel" data-i18n="to"></label>
        <select id="toSel"></select>
      </div>
      <fieldset class="ticket-group">
        <legend data-i18n="ticket"></legend>
        <label><input type="radio" name="ticket" value="single"> <span data-i18n="single"></span></label>
        <label><input type="radio" name="ticket" value="pass"> <span data-i18n="pass"></span></label>
        <label><input type="radio" name="ticket" value="conc"> <span data-i18n="conc"></span></label>
      </fieldset>
      <button id="calcBtn" class="primary" type="button" data-i18n="calcBtn"></button>
      <p id="calcErr" class="err" hidden></p>
    </div>
    <div class="card" id="result" hidden>
      <h2 id="resTitle"></h2>
      <div id="resRows"></div>
      <p id="resMeta" class="meta"></p>
      <p id="resVia" class="via"></p>
    </div>
  </section>

  <section class="tab" id="tab-chart" hidden>
    <p class="hint" data-i18n="chartHint"></p>
    <input id="chartSearch" type="search" data-i18n-ph="search" placeholder="">
    <div class="tablewrap"><table id="chartTable"></table></div>
    <p id="chartEmpty" class="err" hidden data-i18n="emptyChart"></p>
  </section>

  <section class="tab" id="tab-pass" hidden>
    <div class="card">
      <h2 data-i18n="passTitle"></h2>
      <div class="field">
        <label for="tripsDay" data-i18n="tripsDay"></label>
        <input id="tripsDay" type="number" min="1" max="10" value="2">
      </div>
      <div class="field">
        <label for="daysWeek" data-i18n="daysWeek"></label>
        <input id="daysWeek" type="number" min="1" max="7" value="5">
      </div>
      <div id="passOut"></div>
      <p class="meta" data-i18n="passNote"></p>
      <button id="calcTripBtn" type="button" data-i18n="tabCalc"></button>
    </div>
  </section>

  <section class="tab" id="tab-line" hidden>
    <p class="hint" data-i18n="lineHint"></p>
    <div id="lineMap" class="line"></div>
  </section>
</main>
<footer>
  <p data-i18n="footer1"></p>
  <p data-i18n="footer2"></p>
  <p data-i18n="footer3"></p>
</footer>
<script src="js/fares.js"></script>
<script src="js/app.js"></script>
</body>
</html>
